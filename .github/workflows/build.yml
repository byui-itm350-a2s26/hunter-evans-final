name: Build and Push

# Build pipeline:
#   Runs when a pull request is merged into main (the trigger the course asks for),
#   and can also be run manually. It installs dependencies, runs the unit and
#   integration tests, then builds the Docker image and pushes it to Docker Hub.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: hunterevans0/hunter-evans-final

jobs:
  test:
    name: Install & Test
    # Only run for merged PRs (skip PRs that are closed without merging).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires a Read & Write Docker Hub access token in DOCKERHUB_TOKEN.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
